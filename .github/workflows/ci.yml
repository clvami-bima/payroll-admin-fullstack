name: CI - Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Fullstack Playwright Tests

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ==========================================
      # BACKEND
      # ==========================================

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend
        working-directory: backend
        shell: bash
        run: |
          nohup npm run dev > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Verify backend
        shell: bash
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000 > /dev/null; then
              echo "Backend is ready!"
              exit 0
            fi

            sleep 2
          done

          echo "Backend failed to start."
          cat backend/backend.log
          exit 1

      # ==========================================
      # FRONTEND
      # ==========================================

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for frontend
        working-directory: frontend
        shell: bash
        run: |
          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend is ready!"
              exit 0
            fi

            sleep 2
          done

          echo "Frontend failed to start."
          cat frontend.log
          exit 1

      # ==========================================
      # PLAYWRIGHT
      # ==========================================

      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: true
        run: npx playwright test

      # ==========================================
      # ARTIFACTS
      # ==========================================

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7

      - name: Upload frontend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-log
          path: frontend/frontend.log
          retention-days: 7