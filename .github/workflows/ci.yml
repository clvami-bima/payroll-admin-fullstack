name: CI - Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Fullstack Playwright Tests
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ==========================================
      # BACKEND DEPENDENCIES
      # ==========================================
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # ==========================================
      # FRONTEND DEPENDENCIES
      # ==========================================
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ==========================================
      # PLAYWRIGHT
      # ==========================================
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      # ==========================================
      # BUILD FRONTEND
      # ==========================================
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ==========================================
      # START BACKEND
      # Backend project listens on PORT 4000
      # ==========================================
      - name: Start backend
        working-directory: backend
        run: |
          nohup npm start > backend.log 2>&1 &
          echo $! > backend.pid

          echo "Menunggu backend..."

          for i in {1..30}; do
            if curl -sS --max-time 3 http://127.0.0.1:4000/ > /dev/null 2>&1; then
              echo "Backend berhasil hidup di port 4000."
              break
            fi

            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

          echo ""
          echo "===== BACKEND LOG ====="
          cat backend.log

      # ==========================================
      # VERIFY BACKEND
      # ==========================================
      - name: Verify backend
        working-directory: backend
        run: |
          echo "Checking backend on port 4000..."

          if curl -sS --max-time 5 http://127.0.0.1:4000/ > /dev/null 2>&1; then
            echo "Backend OK."
          else
            echo "Backend tidak merespons."
            echo ""
            echo "===== BACKEND LOG ====="
            cat backend.log || true
            exit 1
          fi

      # ==========================================
      # START FRONTEND
      # ==========================================
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > frontend.log 2>&1 &
          echo $! > frontend.pid

          sleep 5

          echo ""
          echo "===== FRONTEND LOG ====="
          cat frontend.log

      # ==========================================
      # WAIT FOR FRONTEND
      # ==========================================
      - name: Wait for frontend
        working-directory: frontend
        run: |
          npx wait-on \
            --timeout 120000 \
            --interval 1000 \
            http://127.0.0.1:5173/login

          echo ""
          echo "Frontend berhasil hidup di port 5173."

          echo ""
          echo "===== FRONTEND LOG ====="
          cat frontend.log

      # ==========================================
      # PLAYWRIGHT TESTS
      # ==========================================
      - name: Run Playwright tests
        working-directory: frontend
        env:
          CI: true
        run: |
          npx playwright test

      # ==========================================
      # SHOW LOGS IF FAILURE
      # ==========================================
      - name: Show server logs
        if: failure()
        run: |
          echo "=========================================="
          echo "BACKEND LOG"
          echo "=========================================="

          cat backend/backend.log || true

          echo ""
          echo "=========================================="
          echo "FRONTEND LOG"
          echo "=========================================="

          cat frontend/frontend.log || true

      # ==========================================
      # PLAYWRIGHT REPORT
      # ==========================================
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # PLAYWRIGHT RESULTS
      # ==========================================
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # ==========================================
      # SERVER LOGS
      # ==========================================
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend/backend.log
            frontend/frontend.log
          if-no-files-found: ignore
          retention-days: 7